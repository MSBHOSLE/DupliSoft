<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Front Card Gradient -->
    <linearGradient id="cardFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Back Card Gradient -->
    <linearGradient id="cardBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <!-- Laser Scanner Glow -->
    <linearGradient id="laserGlow" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowBack" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#8b5cf6" flood-opacity="0.35" />
    </filter>
    <filter id="shadowFront" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="30" stdDeviation="40" flood-color="#06b6d4" flood-opacity="0.45" />
    </filter>
    <filter id="neonBeam" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1024" height="1024" rx="224" fill="url(#bgGlow)" />
  <rect width="1020" height="1020" x="2" y="2" rx="222" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Subtle Grid Pattern in Background -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="2">
    <line x1="256" y1="0" x2="256" y2="1024" />
    <line x1="512" y1="0" x2="512" y2="1024" />
    <line x1="768" y1="0" x2="768" y2="1024" />
    <line x1="0" y1="256" x2="1024" y2="256" />
    <line x1="0" y1="512" x2="1024" y2="512" />
    <line x1="0" y1="768" x2="1024" y2="768" />
  </g>

  <!-- Ambient Light Orb -->
  <circle cx="512" cy="460" r="260" fill="#6366f1" opacity="0.18" filter="url(#neonBeam)" />

  <!-- ==================== BACK DOCUMENT (File 2) ==================== -->
  <g transform="translate(420, 240) rotate(14) scale(0.92)" filter="url(#shadowBack)">
    <rect width="360" height="460" rx="44" fill="url(#cardBack)" />
    <!-- Glass sheen -->
    <rect width="356" height="456" x="2" y="2" rx="42" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="3" />
    <!-- File Fold Dog-ear corner -->
    <path d="M 260 0 L 360 100 L 260 100 Z" fill="rgba(0,0,0,0.18)" />
    <!-- Document Lines -->
    <rect x="60" y="140" width="160" height="18" rx="9" fill="rgba(255,255,255,0.55)" />
    <rect x="60" y="180" width="220" height="18" rx="9" fill="rgba(255,255,255,0.35)" />
    <rect x="60" y="220" width="200" height="18" rx="9" fill="rgba(255,255,255,0.35)" />
    <rect x="60" y="260" width="150" height="18" rx="9" fill="rgba(255,255,255,0.35)" />
  </g>

  <!-- ==================== FRONT DOCUMENT (File 1) ==================== -->
  <g transform="translate(244, 250)" filter="url(#shadowFront)">
    <!-- Main Card Body -->
    <rect width="380" height="480" rx="48" fill="url(#cardFront)" />
    <!-- Glass Border Highlight -->
    <rect width="376" height="476" x="2" y="2" rx="46" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="4" />

    <!-- File Top Fold Corner -->
    <path d="M 270 0 L 380 110 L 270 110 Z" fill="rgba(2, 6, 23, 0.22)" />
    <path d="M 270 0 L 380 110 L 270 110 Z" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="3" />

    <!-- Stylized Geometric "D" Monogram in Center of Front File -->
    <g transform="translate(85, 150)">
      <!-- Outer D -->
      <path d="M 30 0 L 110 0 C 170 0 210 40 210 100 C 210 160 170 200 110 200 L 30 200 Z" 
            fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Inner Duplicate Icon within D -->
      <rect x="75" y="55" width="55" height="70" rx="10" fill="none" stroke="#ffffff" stroke-width="12" opacity="0.9" />
      <rect x="95" y="75" width="55" height="70" rx="10" fill="#ffffff" opacity="0.85" />
    </g>

    <!-- Document Info Bars -->
    <rect x="70" y="390" width="150" height="16" rx="8" fill="rgba(255,255,255,0.7)" />
    <rect x="70" y="420" width="220" height="14" rx="7" fill="rgba(255,255,255,0.4)" />
  </g>

  <!-- ==================== LASER SCANNER BEAM ==================== -->
  <g filter="url(#neonBeam)">
    <!-- Broad Glow Band -->
    <rect x="120" y="500" width="784" height="20" rx="10" fill="url(#laserGlow)" opacity="0.75" />
    <!-- Ultra-Bright Core Laser Line -->
    <line x1="160" y1="510" x2="864" y2="510" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <!-- Laser Optical Dots on File Edges -->
    <circle cx="244" cy="510" r="9" fill="#ffffff" />
    <circle cx="244" cy="510" r="16" fill="#38bdf8" opacity="0.6" />
    <circle cx="624" cy="510" r="9" fill="#ffffff" />
    <circle cx="624" cy="510" r="16" fill="#38bdf8" opacity="0.6" />
  </g>

  <!-- ==================== BRANDING TYPOGRAPHY ==================== -->
  <text x="512" y="860" 
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" 
        font-size="62" 
        font-weight="900" 
        letter-spacing="6" 
        fill="#ffffff" 
        text-anchor="middle">
    DUPLISOFT
  </text>
  
  <text x="512" y="904" 
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" 
        font-size="20" 
        font-weight="600" 
        letter-spacing="8" 
        fill="#94a3b8" 
        text-anchor="middle">
    DUPLICATE FILE FINDER
  </text>
</svg>
