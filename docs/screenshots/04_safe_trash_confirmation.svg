<svg width="900" height="520" viewBox="0 0 900 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="520" rx="16" fill="#0B0F19"/>
  <rect x="1" y="1" width="898" height="518" rx="15" stroke="#1F2937" stroke-width="2"/>
  
  <!-- Backdrop Blur Simulation -->
  <rect x="0" y="0" width="900" height="520" rx="16" fill="#000000" fill-opacity="0.6"/>

  <!-- Centered Modal Dialog -->
  <rect x="210" y="90" width="480" height="340" rx="16" fill="#111827" stroke="#374151" stroke-width="2"/>
  
  <!-- Warning Icon -->
  <circle cx="450" cy="150" r="32" fill="#7F1D1D" fill-opacity="0.3"/>
  <text x="450" y="159" fill="#EF4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="28" font-weight="700" text-anchor="middle">🗑️</text>

  <!-- Modal Title -->
  <text x="450" y="210" fill="#F9FAFB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="18" font-weight="700" text-anchor="middle">Confirm Move to Trash</text>
  
  <!-- Description -->
  <text x="450" y="240" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" text-anchor="middle">You are about to move 142 duplicate files (4.82 GB) to your OS Trash.</text>

  <!-- Safe Recovery Note -->
  <rect x="240" y="260" width="420" height="48" rx="8" fill="#064E3B" fill-opacity="0.2" stroke="#059669"/>
  <text x="450" y="280" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600" text-anchor="middle">🔒 REVERSIBLE &amp; SAFE RECOVERY</text>
  <text x="450" y="298" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" text-anchor="middle">Files are NOT permanently destroyed. Restore anytime via macOS Trash or Recycle Bin.</text>

  <!-- Actions -->
  <rect x="250" y="340" width="180" height="42" rx="8" fill="#1F2937" stroke="#374151"/>
  <text x="340" y="366" fill="#E5E7EB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="600" text-anchor="middle">Cancel</text>

  <rect x="470" y="340" width="180" height="42" rx="8" fill="#DC2626"/>
  <text x="560" y="366" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="600" text-anchor="middle">Move to Trash</text>
</svg>
